<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form liên hệ</title>

    <link rel="stylesheet" href="style10.css" />
  </head>
  <body>
    <div class="form-container">
      <header class="form-header">
        <h1>Liên hệ với chúng tôi</h1>
        <p>
          Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.
        </p>
      </header>

      <form class="contact-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="ho-ten">Họ và tên</label>
            <input
              type="text"
              id="ho-ten"
              name="ho-ten"
              placeholder="Nhập họ và tên"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="dien-thoai">Số điện thoại</label>
            <input
              type="tel"
              id="dien-thoai"
              name="dien-thoai"
              placeholder="Nhập số điện thoại"
              required
            />
          </div>

          <div class="form-group">
            <label for="chu-de">Chủ đề</label>
            <select id="chu-de" name="chu-de" required>
              <option value="">-- Chọn chủ đề --</option>
              <option value="khoa-hoc">Hỏi về khóa học</option>
              <option value="hoc-phi">Hỏi về học phí</option>
              <option value="ky-thuat">Hỗ trợ kỹ thuật</option>
              <option value="khac">Khác</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="noi-dung">Nội dung</label>
            <textarea
              id="noi-dung"
              name="noi-dung"
              rows="4"
              placeholder="Nhập nội dung liên hệ..."
              required
            ></textarea>
          </div>

          <div class="consent full-width">
            <input type="checkbox" id="dong-y" name="dong-y" required />
            <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
          </div>

          <div class="form-actions full-width">
            <button type="submit" class="btn-submit">Gửi liên hệ</button>
            <button type="reset" class="btn-reset">Nhập lại</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
