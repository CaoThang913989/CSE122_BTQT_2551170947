<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css" />
    <script src="bai16.js" defer></script>
  </head>
  <body>
    <div class="todo-app">
      <header class="header">
        <h1>Danh sách việc cần làm</h1>
        <p>
          Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.
        </p>
      </header>

      <form class="todo-form" id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Nhập công việc cần làm..."
        />
        <button type="submit">Thêm</button>
      </form>

      <ul class="todo-list" id="todo-list">
        <li class="todo-item completed">
          <button class="task-toggle" type="button">✓</button>
          <span class="task-text">Đọc chương HTML5 cơ bản</span>
          <button class="delete-button" type="button">Xoá</button>
        </li>

        <li class="todo-item">
          <button class="task-toggle" type="button"></button>
          <span class="task-text">Làm bài tập CSS Grid</span>
          <button class="delete-button" type="button">Xoá</button>
        </li>

        <li class="todo-item">
          <button class="task-toggle" type="button"></button>
          <span class="task-text">Quay video OBS nộp bài</span>
          <button class="delete-button" type="button">Xoá</button>
        </li>
      </ul>

      <p class="remaining" id="remaining-count"></p>
    </div>
  </body>
</html>
