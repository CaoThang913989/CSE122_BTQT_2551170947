<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In lịch</title>

    <link rel="stylesheet" href="bai12.css" />

    <script src="bai12.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="calendar-page">
        <section class="calendar">
          <div class="year" id="ket-qua-nam">2026</div>
          <div class="month" id="ket-qua-thang">Tháng 12</div>
          <div class="day" id="ket-qua-ngay">24</div>
          <div class="weekday" id="ket-qua-thu">Thứ hai</div>
        </section>

        <p class="greeting" id="loi-chao">Chào buổi sáng!</p>

        <form class="date-form" id="form-lich">
          <div class="date-group">
            <label for="ngay">Ngày</label>
            <input type="number" id="ngay" min="1" max="31" required />
          </div>

          <div class="date-group">
            <label for="thang">Tháng</label>
            <input type="number" id="thang" min="1" max="12" required />
          </div>

          <div class="date-group">
            <label for="nam">Năm</label>
            <input type="number" id="nam" min="1" max="9999" required />
          </div>

          <button type="submit">In lịch</button>
        </form>

        <p class="error" id="thong-bao" role="alert"></p>
      </main>
    </div>
  </body>
</html>
