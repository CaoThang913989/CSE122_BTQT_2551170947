<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="bai17.css" />
    <script src="bai17.js" defer></script>
  </head>
  <body>
    <main class="signup-card">
      <header class="signup-header">
        <h1>Đăng ký tài khoản</h1>
        <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
      </header>

      <form id="signup-form" novalidate>
        <div class="form-field">
          <label for="full-name">Họ và tên</label>
          <input
            id="full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            aria-describedby="full-name-feedback"
          />
          <p class="feedback" id="full-name-feedback" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            aria-describedby="email-feedback"
          />
          <p class="feedback" id="email-feedback" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="password">Mật khẩu</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            aria-describedby="password-feedback"
          />
          <p class="feedback" id="password-feedback" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="confirm-password">Xác nhận mật khẩu</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            aria-describedby="confirm-password-feedback"
          />
          <p
            class="feedback"
            id="confirm-password-feedback"
            aria-live="polite"
          ></p>
        </div>

        <button type="submit">Đăng ký</button>
        <p class="form-status" id="form-status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
